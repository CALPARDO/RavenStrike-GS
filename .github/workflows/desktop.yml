name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      online_windows_map:
        description: Exercise the packaged Windows map with live imagery providers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-2025, platform: windows-x64 }
          - { runner: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.22.3
      - name: Test station behavior
        run: python -m pytest -q tests
      - name: Build desktop application
        run: |
          git rev-parse --short=12 HEAD > BUILD_ID
          python -m PyInstaller --noconfirm --windowed --onedir --name RavenStrike-GS \
            --add-data 'BUILD_ID:.' --add-data 'contract:contract' --add-data 'demo:demo' --hidden-import rosbags.typesys.stores.ros2_jazzy \
            --hidden-import rosbags.serde.primitives --copy-metadata rosbags --copy-metadata rfd_bridge \
            --exclude-module tkinter --exclude-module pytest gs.py
      - name: Smoke-test packaged application
        run: python tests/packaged_smoke.py
      - name: Check Windows map with live satellite and street tiles
        if: runner.os == 'Windows' && inputs.online_windows_map
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          $app = Start-Process "dist/RavenStrike-GS/RavenStrike-GS.exe" -ArgumentList "--self-test","online" -PassThru
          if (-not $app.WaitForExit(90000)) {
            $app.Kill()
            throw "Online map check timed out"
          }
          if ($app.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/RavenStrike-GS/logs/desktop-crash.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "Online map check failed ($($app.ExitCode))"
          }
      - name: Windows crash diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA/RavenStrike-GS/logs/desktop-crash.log" -Tail 80 -ErrorAction SilentlyContinue
      - name: Archive application
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd dist
          case "$RUNNER_OS" in
            macOS) tar -czf "../RavenStrike-GS-$PLATFORM.tar.gz" RavenStrike-GS.app ;;
            Linux) tar -czf "../RavenStrike-GS-$PLATFORM.tar.gz" RavenStrike-GS ;;
            Windows) 7z a -tzip "../RavenStrike-GS-$PLATFORM.zip" RavenStrike-GS ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: RavenStrike-GS-${{ matrix.platform }}
          path: RavenStrike-GS-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Publish packages and checksums
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum RavenStrike-GS-* > SHA256SUMS
          gh release create "$TAG" --verify-tag --generate-notes RavenStrike-GS-* SHA256SUMS
