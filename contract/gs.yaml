# Mission wire map v8; both endpoints need matching workflow interfaces.
# Jetson header and USB bench pair. Match the serial settings on replacement modems.
# Supply serial_port explicitly and review both endpoint settings.
bridge_id: ravenstrike_gs
diagnostics_topic: /rfd_bridge/diagnostics
diagnostics_period_sec: 0.5
serial:
  port: /dev/serial/by-id/TBD-RFD900x-US
  baud: 460800
  rtscts: true
  reconnect: true
link:
  bandwidth_limit_bps: 20000
  mtu_payload: 256
  max_message_size: 16384
  max_queue_bytes: 65536
  max_reassembly_messages: 16
  reassembly_timeout_sec: 5.0
  ack_timeout_sec: 1.0
  max_retries: 3
  max_reliable_pending: 32
  hello_interval_sec: 0.2
  link_timeout_sec: 1.0
  refuse_on_config_mismatch: true
topics:
  tasks:
    id: 1
    ros_topic: /ravenstrike/radio/tx/tasks
    remote_topic: /ravenstrike/radio/rx/tasks
    type: ravenstrike_interfaces/msg/GroundTaskAssignment
    direction: tx
    priority: 1
    reliability: reliable
    queue_depth: 8
    max_rate_hz: 0.0
    qos:
      reliability: reliable
      durability: volatile
      depth: 10
  reports:
    id: 2
    ros_topic: /ravenstrike/radio/tx/reports
